shellEmulator: true
trustPolicy: no-downgrade

packages:
  - 'apps/*'
  - 'extensions/*'
  - 'packages/*'
  - 'services/*'

catalogs:

  build:
    '@antfu/eslint-config': ^9.0.0
    '@antfu/ni': ^30.1.0
    '@commitlint/cli': ^21.0.2
    '@commitlint/config-conventional': ^21.0.2
    '@typescript/native-preview': 7.0.0-dev.20260603.1
    eslint: ^10.4.1
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.0.7
    premove: ^4.0.0
    simple-git-hooks: ^2.13.1
    taze: ^19.14.1
    turbo: ^2.9.16
    typescript: ^6.0.3
  dev:
    zod: ^4.4.3
  testing:
    vitest: ^4.1.8
  types:
    '@types/node': ^25.9.1

allowBuilds:
  simple-git-hooks: true
