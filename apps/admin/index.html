<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XiaoShop</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #splash {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }
      #splash-card {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }
      #splash-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="splash">
        <div id="splash-card" aria-label="XiaoShop splash screen">
          <img id="splash-logo" src="/favicon.svg" alt="XiaoShop" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <noscript> This website requires JavaScript to function properly. Please enable JavaScript to continue. </noscript>
  </body>
</html>
